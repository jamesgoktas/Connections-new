    <script src="https://unpkg.com" crossorigin></script>

    <script src="https://unpkg.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    /* ============================================================
       CONFIG
       ============================================================ */
    const ADMIN_PASSWORD = "SHORESCHOOLISGREAT67";
    const SECRET_CLICKS = 7; 

    const DIFFICULTY_ORDER = ["yellow", "green", "blue", "purple"];
    const DIFFICULTY_STYLE = {
      yellow: { bg: "#f9df6d", label: "Yellow · easiest", emoji: "🟨" },
      green:  { bg: "#a0c35a", label: "Green", emoji: "🟩" },
      blue:   { bg: "#b0c4ef", label: "Blue", emoji: "🟦" },
      purple: { bg: "#ba81c5", label: "Purple · trickiest", emoji: "🟪" },
    };
    const MAX_MISTAKES = 4;

    const ACCENT = "#6C5CE7";
    const ACCENT_PINK = "#FF6FA5";
    const HEADER_GRADIENT = `linear-gradient(90deg, ${ACCENT}, ${ACCENT_PINK})`;
    const PAGE_BG = "linear-gradient(180deg, #f7f5ff 0%, #ffffff 260px)";

    /* ============================================================
       LOCAL STORAGE DATABASE REPLACEMENTS
       ============================================================ */
    const INDEX_KEY = "connections:index";
    const puzzleKey = (id) => `connections:puzzle:${id}`;
    const ANALYTICS_KEY = "connections:analytics";
    const STATS_KEY = "connections:stats";
    const LEADERBOARD_KEY = "connections:leaderboard";

    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s.toString().padStart(2, "0")}`;
    }

    let _audioCtx = null;
    function getAudioCtx() {
      try {
        if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return _audioCtx;
      } catch {
        return null;
      }
    }
    function playTone(freqs, durationMs, type) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      freqs.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.001, now + i * 0.09);
        gain.gain.exponentialRampToValueAtTime(0.15, now + i * 0.09 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + durationMs / 1000);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.09);
        osc.stop(now + i * 0.09 + durationMs / 1000 + 0.02);
      });
    }
    function playDing() { playTone([660, 880], 220, "sine"); }
    function playBuzz() { playTone([160, 110], 260, "sawtooth"); }
    function playWinFanfare() { playTone([523, 659, 784, 1047], 260, "sine"); }

    async function loadIndex() {
      try {
        const res = localStorage.getItem(INDEX_KEY);
        return res ? JSON.parse(res) : [];
      } catch {
        return [];
      }
    }
    async function saveIndex(list) {
      localStorage.setItem(INDEX_KEY, JSON.stringify(list));
    }
    async function loadPuzzle(id) {
      try {
        const res = localStorage.getItem(puzzleKey(id));
        return res ? JSON.parse(res) : null;
      } catch {
        return null;
      }
    }
    async function savePuzzle(puzzle) {
      localStorage.setItem(puzzleKey(puzzle.id), JSON.stringify(puzzle));
    }
    async function deletePuzzleStorage(id) {
      try { localStorage.removeItem(puzzleKey(id)); } catch {}
    }

    async function loadAnalytics() {
      try {
        const res = localStorage.getItem(ANALYTICS_KEY);
        return res ? JSON.parse(res) : { total: 0, daily: {} };
      } catch {
        return { total: 0, daily: {} };
      }
    }
    async function logVisit() {
      try {
        const data = await loadAnalytics();
        const today = new Date().toISOString().slice(0, 10);
        data.total = (data.total || 0) + 1;
        data.daily = data.daily || {};
        data.daily[today] = (data.daily[today] || 0) + 1;
        localStorage.setItem(ANALYTICS_KEY, JSON.stringify(data));
      } catch {}
    }

    async function loadStats() {
      try {
        const res = localStorage.getItem(STATS_KEY);
        return res ? JSON.parse(res) : {};
      } catch {
        return {};
      }
    }
    async function logResult(puzzleId, result) {
      try {
        const stats = await loadStats();
        const s = stats[puzzleId] || { wins: 0, losses: 0 };
        if (result === "won") s.wins += 1;
        if (result === "lost") s.losses += 1;
        stats[puzzleId] = s;
        localStorage.setItem(STATS_KEY, JSON.stringify(stats));
      } catch {}
    }

    async function loadLeaderboard() {
      try {
        const res = localStorage.getItem(LEADERBOARD_KEY);
        return res ? JSON.parse(res) : {};
      } catch {
        return {};
      }
    }
    async function loadMyInitials() {
      try {
        const res = localStorage.getItem("connections:myinitials");
        return res ? res : "";
      } catch {
        return "";
      }
    }
    async function saveMyInitials(initials) {
      try { localStorage.setItem("connections:myinitials", initials); } catch {}
    }

    function Confetti() {
      const pieces = Array.from({ length: 40 }).map((_, i) => ({
        id: i,
        left: Math.random() * 100,
        delay: Math.random() * 0.4,
        duration: 1.6 + Math.random() * 1.2,
        color: ["#f9df6d", "#a0c35a", "#b0c4ef", "#ba81c5", "#ff8a65"][i % 5],
        rotate: Math.random() * 360,
        size: 6 + Math.random() * 6,
      }));
      return (
        <div style={{ position: "fixed", inset: 0, pointerEvents: "none", overflow: "hidden", zIndex: 900 }}>
          <style>{`
            @keyframes confettiFall {
              0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
              100% { transform: translateY(110vh) rotate(360deg); opacity: 0.9; }
            }
          `}</style>
          {pieces.map((p) => (
            <div
              key={p.id}
              style={{
                position: "absolute", top: 0, left: `${p.left}%`,
                width: p.size, height: p.size * 0.6, background: p.color,
                animation: `confettiFall ${p.duration}s ease-in ${p.delay}s forwards`,
                transform: `rotate(${p.rotate}deg)`, borderRadius: 2,
              }}
            />
          ))}
        </div>
      );
    }

    async function submitLeaderboardEntry(puzzleId, initials, timeSeconds, mistakes) {
      try {
        const all = await loadLeaderboard();
        const list = all[puzzleId] || [];
        list.push({ initials: initials.toUpperCase().slice(0, 3), timeSeconds, mistakes });
        list.sort((a, b) => a.mistakes - b.mistakes || a.timeSeconds - b.timeSeconds);
        all[puzzleId] = list.slice(0, 10);
        localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(all));
        return all[puzzleId];
      } catch {
        return [];
      }
    }

    /* ============================================================
       ROOT
       ============================================================ */
    function ConnectionsRoot() {
      const [showAdminModal, setShowAdminModal] = useState(false);
      const clickCountRef = useRef(0);
      const clickTimerRef = useRef(null);

      function handleSecretTrigger() {
        clickCountRef.current += 1;
        clearTimeout(clickTimerRef.current);
        clickTimerRef.current = setTimeout(() => { clickCountRef.current = 0; }, 1500);
        if (clickCountRef.current >= SECRET_CLICKS) {
          clickCountRef.current = 0;
          setShowAdminModal(true);
        }
      }

      return (
        <div style={{
          minHeight: "100vh", width: "100%", background: PAGE_BG,
          fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif",
          color: "#000",
        }}>
          <GameApp onSecretTrigger={handleSecretTrigger} />

          {showAdminModal && (
            <div
              style={{
                position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)",
                display: "flex", alignItems: "flex-start", justifyContent: "center",
                overflowY: "auto", zIndex: 1000, padding: "20px 0",
              }}
              onClick={(e) => { if (e.target === e.currentTarget) setShowAdminModal(false); }}
            >
              <div style={{ background: "#fff", borderRadius: 16, width: "min(820px, 94%)", position: "relative" }}>
                <button
                  onClick={() => setShowAdminModal(false)}
                  style={{ position: "absolute", top: 14, right: 14, background: "none", border: "none", fontSize: 22, cursor: "pointer", color: "#999", lineHeight: 1 }}
                  aria-label="Close"
                >
                  ×
                </button>
                <AdminGate />
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ============================================================
       ADMIN GATE
Use code with caution.============================================================ */function AdminGate() {const [authed, setAuthed] = useState(false);const [pw, setPw] = useState("");const [error, setError] = useState("");function submit() {if (pw === ADMIN_PASSWORD) {setAuthed(true);setError("");} else {setError("That password isn't right.");}}if (authed) return ;return (<div style={{ maxWidth: 380, margin: "0 auto", padding: "80px 24px", textAlign: "center" }}><h1 style={{ fontSize: 22, fontWeight: 800, marginBottom: 6 }}>Admin access<p style={{ fontSize: 14, color: "#666", marginBottom: 24 }}>Enter the password to manage puzzles.<inputtype="password"value={pw}onChange={(e) => setPw(e.target.value)}onKeyDown={(e) => { if (e.key === "Enter") submit(); }}placeholder="Password"style={{ width: "100%", padding: "12px 14px", fontSize: 15, border: "2px solid #000", borderRadius: 8, marginBottom: 12, boxSizing: "border-box" }}autoFocus/>{error && <div style={{ color: "#c0392b", fontSize: 13, marginBottom: 12 }}>{error}}<buttononClick={submit}style={{ width: "100%", padding: "12px 14px", fontSize: 15, fontWeight: 700, background: "#000", color: "#fff", border: "none", borderRadius: 8, cursor: "pointer" }}>Enter);}/* ============================================================ADMIN PANEL============================================================ */function emptyGroups() {return DIFFICULTY_ORDER.map((d) => ({ difficulty: d, category: "", words: ["", "", "", ""] }));}const AI_DIFFICULTY_PRESETS = {easy: {label: "Easy",prompt: "Keep it approachable: common vocabulary, fairly obvious category connections, minimal wordplay or trickery, even in the purple group.",},medium: {label: "Medium",prompt: "Use a normal mix: yellow and green should be fairly clear, blue a bit less obvious, and purple should involve some wordplay or a twist, but nothing too obscure.",},hard: {label: "Hard",prompt: "Make it genuinely challenging: rely on overlapping words that could plausibly fit more than one group, less common vocabulary, and real wordplay or double meanings, especially in blue and purple.",},extreme: {label: "Extreme / wordplay-heavy",prompt: "Make this very hard, NYT-Sunday-puzzle level: heavy use of puns, homophones, hidden words, or misdirection where several words look like they belong to a different group than they do. Purple should be genuinely tricky to see even after getting the other three.",},};function Section({ title, icon, defaultOpen = true, children }) {const [open, setOpen] = useState(defaultOpen);return (<div style={{ border: "1px solid #eee", borderRadius: 14, marginBottom: 16, overflow: "hidden", background: "#fff", boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}><buttononClick={() => setOpen(!open)}style={{width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center",padding: "14px 18px", background: "none", border: "none", cursor: "pointer", textAlign: "left",borderLeft: 4px solid ${ACCENT},}}><span style={{ fontSize: 15, fontWeight: 700 }}>{icon} {title}<span style={{ fontSize: 13, color: "#999" }}>{open ? "▲" : "▼"}{open && <div style={{ padding: "0 18px 18px 22px" }}>{children}});}function AdminPanel() {const [index, setIndex] = useState(null);const [name, setName] = useState("");const [groups, setGroups] = useState(emptyGroups());const [difficultyScore, setDifficultyScore] = useState("");const [saving, setSaving] = useState(false);const [status, setStatus] = useState("");const [editingId, setEditingId] = useState(null);const [confirmDeleteId, setConfirmDeleteId] = useState(null);const [previewId, setPreviewId] = useState(null);const [aiTopic, setAiTopic] = useState("");const [aiDifficulty, setAiDifficulty] = useState("medium");const [aiLoading, setAiLoading] = useState(false);const [aiError, setAiError] = useState("");const [analytics, setAnalytics] = useState(null);const [stats, setStats] = useState({});const [bulkText, setBulkText] = useState("");const [bulkStatus, setBulkStatus] = useState("");const [backupText, setBackupText] = useState("");const [backupCopied, setBackupCopied] = useState(false);const refresh = useCallback(async () => {const list = await loadIndex();setIndex(list.sort((a, b) => b.createdAt - a.createdAt));setStats(await loadStats());}, []);useEffect(() => { refresh(); loadAnalytics().then(setAnalytics); }, [refresh]);function updateWord(gi, wi, value) {setGroups((prev) => {const next = prev.map((g) => ({ ...g, words: [...g.words] }));next[gi].words[wi] = value;return next;});}function updateCategory(gi, value) {setGroups((prev) => {const next = prev.map((g) => ({ ...g, words: [...g.words] }));next[gi].category = value;return next;});}function validate() {if (!name.trim()) return "Give the puzzle a name.";for (const g of groups) {if (!g.category.trim()) return "Every category needs a name.";for (const w of g.words) if (!w.trim()) return "Every group needs 4 words.";}const allWords = groups.flatMap((g) => g.words.map((w) => w.trim().toUpperCase()));if (new Set(allWords).size !== 16) return "All 16 words must be different.";return null;}function resetForm() {setName("");setGroups(emptyGroups());setDifficultyScore("");setEditingId(null);setStatus("");}async function handleSave() {const err = validate();if (err) { setStatus(err); return; }setSaving(true);setStatus("");const id = editingId || newId();const existing = editingId ? await loadPuzzle(editingId) : null;const puzzle = {id,name: name.trim(),createdAt: existing ? existing.createdAt : Date.now(),difficultyScore: difficultyScore === "" ? null : Number(difficultyScore),groups: groups.map((g) => ({difficulty: g.difficulty,category: g.category.trim(),words: g.words.map((w) => w.trim().toUpperCase()),})),};try {await savePuzzle(puzzle);const list = await loadIndex();const entry = { id, name: puzzle.name, createdAt: puzzle.createdAt, difficultyScore: puzzle.difficultyScore };const nextList = editingId? list.map((p) => (p.id === id ? entry : p)): [...list, entry];await saveIndex(nextList);const wasEditing = !!editingId;resetForm();setStatus(wasEditing ? "Puzzle updated." : "Puzzle saved.");refresh();} catch {setStatus("Something went wrong saving — try again.");}setSaving(false);}async function handleEdit(id) {const p = await loadPuzzle(id);if (!p) return;setName(p.name);setDifficultyScore(p.difficultyScore != null ? String(p.difficultyScore) : "");setGroups(DIFFICULTY_ORDER.map((d) => {const found = p.groups.find((g) => g.difficulty === d);return found? { difficulty: d, category: found.category, words: [...found.words] }: { difficulty: d, category: "", words: ["", "", "", ""] };}));setEditingId(id);setStatus("");}async function handleDuplicate(id) {const p = await loadPuzzle(id);if (!p) return;setName(p.name + " (copy)");setDifficultyScore(p.difficultyScore != null ? String(p.difficultyScore) : "");setGroups(DIFFICULTY_ORDER.map((d) => {const found = p.groups.find((g) => g.difficulty === d);return found? { difficulty: d, category: found.category, words: [...found.words] }: { difficulty: d, category: "", words: ["", "", "", ""] };}));setEditingId(null);setStatus("Loaded as a copy — click Save puzzle to create a new one.");}async function handleDelete(id) {if (confirmDeleteId !== id) {setConfirmDeleteId(id);return;}setConfirmDeleteId(null);const list = await loadIndex();await saveIndex(list.filter((p) => p.id !== id));await deletePuzzleStorage(id);if (editingId === id) resetForm();refresh();}async function handleGenerate() {setAiLoading(true);setAiError("");setAiError("Direct AI generator requests require a Vercel secure API backend. Please use the Manual Grid tools below to test your admin layout for now.");setAiLoading(false);}async function handleBulkImport() {setBulkStatus("");let parsed;try {parsed = JSON.parse(bulkText);if (!Array.isArray(parsed)) throw new Error("not an array");} catch {setBulkStatus("That doesn't look like valid JSON — check the format and try again.");return;}const list = await loadIndex();const newEntries = [];let imported = 0;let skipped = 0;for (const item of parsed) {if (!item || !item.name || !Array.isArray(item.groups) || item.groups.length !== 4) { skipped++; continue; }const okGroups = item.groups.every((g) => g && g.category && Array.isArray(g.words) && g.words.length === 4);if (!okGroups) { skipped++; continue; }const id = newId();const createdAt = Date.now() + imported;const orderedGroups = DIFFICULTY_ORDER.map((d, i) => {const found = item.groups.find((g) => g.difficulty === d) || item.groups[i];return {difficulty: d,category: String(found.category).trim(),words: found.words.map((w) => String(w).trim().toUpperCase()),};});const puzzle = {id, name: String(item.name).trim(), createdAt,difficultyScore: item.difficultyScore != null ? Number(item.difficultyScore) : null,groups: orderedGroups,};await savePuzzle(puzzle);newEntries.push({ id, name: puzzle.name, createdAt, difficultyScore: puzzle.difficultyScore });imported++;}await saveIndex([...list, ...newEntries]);setBulkStatus(Imported ${imported} puzzle${imported === 1 ? "" : "s"}.${skipped ?  Skipped ${skipped} that didn't match the format. : ""});setBulkText("");refresh();}async function handleExport() {const list = await loadIndex();const puzzles = {};for (const p of list) puzzles[p.id] = await loadPuzzle(p.id);const dump = {index: list,puzzles,stats: await loadStats(),leaderboard: await loadLeaderboard(),analytics: await loadAnalytics(),exportedAt: new Date().toISOString(),};setBackupText(JSON.stringify(dump, null, 2));}async function handleCopyBackup() {try {await navigator.clipboard.writeText(backupText);setBackupCopied(true);setTimeout(() => setBackupCopied(false), 2000);} catch {}}return (<div style={{ maxWidth: 780, margin: "0 auto", padding: "40px 24px 80px" }}><h1 style={{ fontSize: 26, fontWeight: 800, marginBottom: 4, background: HEADER_GRADIENT, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", backgroundClip: "text", display: "inline-block" }}>Puzzle admin<p style={{ fontSize: 14, color: "#666", marginBotto
