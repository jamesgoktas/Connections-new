    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s.toString().padStart(2, "0")}`;
    }

    let _audioCtx = null;
    function getAudioCtx() {
      try {
        if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return _audioCtx;
      } catch {
        return null;
      }
    }
    function playTone(freqs, durationMs, type) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      freqs.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.001, now + i * 0.09);
        gain.gain.exponentialRampToValueAtTime(0.15, now + i * 0.09 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + durationMs / 1000);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.09);
        osc.stop(now + i * 0.09 + durationMs / 1000 + 0.02);
      });
    }
    function playDing() { playTone([660, 880], 220, "sine"); }
    function playBuzz() { playTone([160, 110], 260, "sawtooth"); }
    function playWinFanfare() { playTone([523, 659, 784, 1047], 260, "sine"); }

    async function loadIndex() {
      try {
        const res = localStorage.getItem(INDEX_KEY);
        return res ? JSON.parse(res) : [];
      } catch {
        return [];
      }
    }
    async function saveIndex(list) {
      localStorage.setItem(INDEX_KEY, JSON.stringify(list));
    }
    async function loadPuzzle(id) {
      try {
        const res = localStorage.getItem(puzzleKey(id));
        return res ? JSON.parse(res) : null;
      } catch {
        return null;
      }
    }
    async function savePuzzle(puzzle) {
      localStorage.setItem(puzzleKey(puzzle.id), JSON.stringify(puzzle));
    }
    async function deletePuzzleStorage(id) {
      try { localStorage.removeItem(puzzleKey(id)); } catch {}
    }

    async function loadAnalytics() {
      try {
        const res = localStorage.getItem(ANALYTICS_KEY);
        return res ? JSON.parse(res) : { total: 0, daily: {} };
      } catch {
        return { total: 0, daily: {} };
      }
    }
    async function logVisit() {
      try {
        const data = await loadAnalytics();
        const today = new Date().toISOString().slice(0, 10);
        data.total = (data.total || 0) + 1;
        data.daily = data.daily || {};
        data.daily[today] = (data.daily[today] || 0) + 1;
        localStorage.setItem(ANALYTICS_KEY, JSON.stringify(data));
      } catch {}
    }

    async function loadStats() {
      try {
        const res = localStorage.getItem(STATS_KEY);
        return res ? JSON.parse(res) : {};
      } catch {
        return {};
      }
    }
    async function logResult(puzzleId, result) {
      try {
        const stats = await loadStats();
        const s = stats[puzzleId] || { wins: 0, losses: 0 };
        if (result === "won") s.wins += 1;
        if (result === "lost") s.losses += 1;
        stats[puzzleId] = s;
        localStorage.setItem(STATS_KEY, JSON.stringify(stats));
      } catch {}
    }

    function Confetti() {
      const pieces = Array.from({ length: 40 }).map((_, i) => ({
        id: i,
        left: Math.random() * 100,
        delay: Math.random() * 0.4,

        <div style={{ position: "fixed", inset: 0, pointerEvents: "none", overflow: "hidden", zIndex: 900 }}>
          <style>{`
            @keyframes confettiFall {
              0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }

          `}</style>
          {pieces.map((p) => (

              style={{
                position: "absolute", top: 0, left: `${p.left}%`,
                width: p.size, height: p.size * 0.6, background: p.color,
                animation: `confettiFall ${p.duration}s ease-in ${p.delay}s forwards`,
                transform: `rotate(${p.rotate}deg)`, borderRadius: 2,
              }}
            />
          ))}
        </div>
      );
    }

    async function submitLeaderboardEntry(puzzleId, initials, timeSeconds, mistakes) {
      try {
        const all = await loadLeaderboard();
        const list = all[puzzleId] || [];
        list.push({ initials: initials.toUpperCase().slice(0, 3), timeSeconds, mistakes });
        list.sort((a, b) => a.mistakes - b.mistakes || a.timeSeconds - b.timeSeconds);
        all[puzzleId] = list.slice(0, 10);
        localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(all));
        return all[puzzleId];
      } catch {
        return [];
      }
    }

    function GameApp({ onSecretTrigger }) {
      const [index, setIndex] = useState(null);
      const [activeId, setActiveId] = useState(null);
      const [difficultyFilter, setDifficultyFilter] = useState("all");
      const [expandedDay, setExpandedDay] = useState(null);

      const refresh = useCallback(async () => {
        const list = await loadIndex();
        setIndex(list.sort((a, b) => b.createdAt - a.createdAt));
      }, []);
      useEffect(() => { refresh(); logVisit(); }, [refresh]);

      if (activeId) {
        return <Board activeId={activeId} index={index || []} onBack={() => setActiveId(null)} onChangePuzzle={setActiveId} />;
      }

      function matchesDifficulty(p) {
        if (difficultyFilter === "all") return true;
        if (difficultyFilter === "unrated") return p.difficultyScore == null;
        const s = p.difficultyScore;
        if (s == null) return false;
        if (difficultyFilter === "easy") return s <= 4;
        if (difficultyFilter === "medium") return s >= 5 && s <= 8;
        if (difficultyFilter === "hard") return s >= 9;
        return true;
      }

      const todayKey = new Date().toISOString().slice(0, 10);
      const dayKeyOf = (p) => new Date(p.createdAt).toISOString().slice(0, 10);
      const allPuzzles = index || [];
      const todaysPuzzles = allPuzzles.filter((p) => dayKeyOf(p) === todayKey).filter(matchesDifficulty);
      const olderPuzzles = allPuzzles.filter((p) => dayKeyOf(p) !== todayKey).filter(matchesDifficulty);

      const groupedByDay = {};
      olderPuzzles.forEach((p) => {
        const k = dayKeyOf(p);
        groupedByDay[k] = groupedByDay[k] || [];
        groupedByDay[k].push(p);
      });
      const dayKeys = Object.keys(groupedByDay).sort().reverse();

      return (
        <div style={{ maxWidth: 640, margin: "0 auto", padding: "56px 24px 80px", textAlign: "center" }}>
          <h1
            onClick={onSecretTrigger}
            style={{
              fontSize: 38, fontWeight: 800, letterSpacing: -0.5, marginBottom: 6, cursor: "default", userSelect: "none",
              background: HEADER_GRADIENT, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", backgroundClip: "text",
              display: "inline-block",
            }}
          >
            Connections
          </h1>
          <p style={{ fontSize: 15, color: "#666", marginBottom: 24 }}>Find groups of four words that share something in common.</p>

            <div style={{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 30, flexWrap: "wrap" }}>
              {[
                ["all", "All"], ["easy", "Easy (1–4)"], ["medium", "Medium (5–8)"], ["hard", "Hard (9–12)"], ["unrated", "Unrated"],
              ].map(([key, label]) => (
                <button
                  key={key}
                  onClick={() => setDifficultyFilter(key)}
                  style={{
                    padding: "6px 12px", borderRadius: 20, fontSize: 12, fontWeight: 700, cursor: "pointer",
                    border: difficultyFilter === key ? "none" : "1px solid #ddd",
                    background: difficultyFilter === key ? ACCENT : "#fff",
                    color: difficultyFilter === key ? "#fff" : "#555",
                  }}
                >
                  {label}
                </button>
              ))}
            </div>

            {index === null && <p style={{ color: "#999" }}>Loading puzzles…</p>}
            {index && allPuzzles.length === 0 && <p style={{ color: "#999" }}>No puzzles are available yet — check back soon.</p>}

            {todaysPuzzles.length > 0 && (
              <div style={{ marginBottom: 30 }}>

                  })}

            )}

            display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 20px",
            border: highlight ? `2px solid ${ACCENT}` : "1px solid #e2e2e2",
            borderRadius: 12, background: highlight ? "#faf7ff" : "#fafafa", cursor: "pointer", textAlign: "left",
          }}
        >
          <span style={{ fontWeight: 700, fontSize: 16 }}>
            {p.name}
            {p.difficultyScore != null && (
              <span style={{ marginLeft: 8, fontSize: 11, fontWeight: 700, color: "#999" }}>· {p.difficultyScore}/12</span>
            )}
          </span>
          <span style={{ fontSize: 13, color: ACCENT, fontWeight: 700 }}>Play →</span>
        </button>
      );
    }

    /* ============================================================
       BOARD — gameplay
       ============================================================ */
    function Board({ activeId, index, onBack, onChangePuzzle, isPreview }) {
      const [puzzle, setPuzzle] = useState(null);
      const [tiles, setTiles] = useState([]);
      const [selected, setSelected] = useState([]);
      const [solved, setSolved] = useState([]);
      const [mistakes, setMistakes] = useState(0);
      const [message, setMessage] = useState("");
      const [shake, setShake] = useState(false);

      const [hintWords, setHintWords] = useState([]);
      const [elapsedSec, setElapsedSec] = useState(0);
      const [leaderboard, setLeaderboard] = useState([]);
      const [initials, setInitials] = useState("");
      const [scoreSubmitted, setScoreSubmitted] = useState(false);
      const [shareCopied, setShareCopied] = useState(false);
      const [showConfetti, setShowConfetti] = useState(false);

      const timeoutRef = useRef(null);
      const intervalRef = useRef(null);

      const loadPuzzleById = useCallback(async (id) => {
        const p = await loadPuzzle(id);
        if (!p) return;
        setPuzzle(p);
        const allTiles = p.groups.flatMap((g, gi) => g.words.map((word) => ({ word, groupIndex: gi })));
        setTiles(shuffle(allTiles));
        setSelected([]);
        setSolved([]);
        setMistakes(0);
        setMessage("");
        setStatus("playing");
        setHintWords([]);
        setElapsedSec(0);
        setInitials("");
        loadMyInitials().then((saved) => { if (saved) setInitials(saved); });
        setScoreSubmitted(false);
        setShareCopied(false);
        clearInterval(intervalRef.current);
        intervalRef.current = setInterval(() => setElapsedSec((s) => s + 1), 1000);
      }, []);

      useEffect(() => { loadPuzzleById(activeId); }, [activeId, loadPuzzleById]);
      useEffect(() => () => { clearTimeout(timeoutRef.current); clearInterval(intervalRef.current); }, []);

      useEffect(() => {
        if (status !== "playing") clearInterval(intervalRef.current);
      }, [status]);

      useEffect(() => {
        if (status === "won" && puzzle && !isPreview) {
          loadLeaderboard().then((all) => setLeaderboard(all[puzzle.id] || []));
        }
      }, [status, puzzle, isPreview]);

      if (!puzzle) return <div style={{ textAlign: "center", padding: 80, color: "#999" }}>Loading puzzle…</div>;

      const remainingTiles = tiles.filter((t) => !solved.includes(t.groupIndex));

      function toggleTile(tile) {
        if (status !== "playing") return;
        setMessage("");
        setSelected((prev) => {
          const already = prev.find((t) => t.word === tile.word);
